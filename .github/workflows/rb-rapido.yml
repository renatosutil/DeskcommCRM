name: RB ciclo rápido de desenvolvimento
on:
  push:
    branches: [rb-trabalho-v1.76.0]
permissions:
  contents: read
jobs:
  testes-afetados:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rb-rapido-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Obter base candidata explicitamente
        run: git fetch --no-tags origin rb-atacado-v1.76.0:refs/remotes/origin/rb-atacado-v1.76.0
      - name: Planejar testes sem build nem deploy
        id: plano
        run: python3 -B scripts/rb-ciclo-rapido.py --github-output
      - uses: ./.github/actions/preparar-node
        name: Preparar Node somente quando necessário
        if: steps.plano.outputs.needs_node == 'true'
        timeout-minutes: 5
      - name: Testes dos arquivos afetados e desdobramentos
        run: python3 -B scripts/rb-ciclo-rapido.py --executar --fase testes
      - name: Checagem de tipos com limite do CI oficial
        if: steps.plano.outputs.needs_node == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: python3 -B scripts/rb-ciclo-rapido.py --executar --fase tipos
      - name: Declarar alcance
        run: echo 'Ciclo de desenvolvimento. Publicação exige os cinco workflows completos do mesmo commit.' >> "$GITHUB_STEP_SUMMARY"
